<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>연결 3D 시제품</title>
  <!-- three.js 는 판을 고정해 CDN 에서 받는다. 빌드 단계 없이 파일 셋으로 돈다 -->
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
  <style>
    /* 연결 3D 는 화이트 판에 캔버스 아래쪽만 남색 그라데이션이다 (설계서 4.1 · 6.5). 한 가지 색 판만 둔다 */
    :root {
      --ink: #1d2433;
      --ink-soft: #5b6478;
      --line: #e1e6ef;
      --card: #ffffff;
      --accent: #7c5cff;      /* 탭 강조 · 연결 (설계서 6.5) */
      --link: #c2400d;        /* 연결선 (설계서 6.5) */
      --bad: #b42318;
      --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font: 14px/1.5 var(--font);
      color: var(--ink);
      background: linear-gradient(180deg, #ffffff 0%, #f2f5fb 38%, #c5cde3 66%, #6c7ca8 86%, #34426e 100%);
      overflow: hidden;
    }
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
    #scene:active { cursor: grabbing; }

    .bar {
      position: fixed; top: 16px; left: 16px; right: 16px;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      pointer-events: none;
    }
    .bar > * { pointer-events: auto; }
    .brand { font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
    .tag {
      font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
      color: var(--accent); border: 1px solid currentColor; border-radius: 999px; padding: 1px 8px;
    }
    .find { position: relative; width: min(320px, 100%); }
    #search {
      width: 100%; height: 36px; padding: 0 12px;
      border: 1px solid var(--line); border-radius: 8px; background: var(--card);
      font: inherit; color: inherit;
    }
    #search:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    #results { position: absolute; top: 40px; left: 0; right: 0; margin: 0; padding: 0; list-style: none;
      background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    #results:empty { display: none; }
    #results button, .links button {
      all: unset; cursor: pointer; display: flex; flex-direction: column; width: 100%; padding: 8px 12px;
    }
    #results button:hover, #results button:focus-visible { background: #f4f2ff; }
    #results span, .links span { font-size: 12px; color: var(--ink-soft); }

    .status { position: fixed; left: 16px; top: 64px; margin: 0; padding: 0; list-style: none;
      font-size: 12px; color: var(--ink-soft); display: grid; gap: 2px; max-width: min(560px, calc(100% - 32px)); }
    .status .bad { color: var(--bad); }

    #labels { position: fixed; inset: 0; pointer-events: none; }
    .island-label {
      position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer;
      font: 600 12px/1 var(--font); color: var(--ink);
      background: rgba(255, 255, 255, 0.92); border: 1px solid var(--line); border-radius: 999px;
      padding: 5px 10px; white-space: nowrap; box-shadow: 0 1px 2px rgba(29, 36, 51, 0.08);
    }
    .island-label.open { color: #2b4a8a; }
    .island-label.on { border-color: var(--accent); color: var(--accent); }
    .island-label:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

    #tip {
      position: fixed; left: 0; top: 0; pointer-events: none; display: grid; gap: 1px;
      background: var(--ink); color: #fff; border-radius: 6px; padding: 6px 9px; font-size: 12px;
    }
    #tip span { color: #c8cfdd; }
    #tip[hidden], #toast[hidden] { display: none; }
    #toast {
      position: fixed; left: 50%; bottom: 88px; transform: translateX(-50%);
      background: var(--ink); color: #fff; border-radius: 8px; padding: 8px 14px; font-size: 13px;
    }

    #panel {
      position: fixed; top: 64px; right: 16px; width: 312px; max-height: calc(100% - 160px);
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      box-shadow: 0 8px 24px rgba(29, 36, 51, 0.12); display: flex; flex-direction: column; overflow: hidden;
    }
    #panel.collapsed { display: none; }
    .panel-head { padding: 14px 16px 10px; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; }
    #panelTitle { margin: 0; font-size: 16px; font-weight: 700; overflow-wrap: anywhere; text-wrap: balance; }
    #panelSub { grid-column: 1; margin: 0; font-size: 12px; color: var(--ink-soft); }
    #panelClose { all: unset; grid-row: 1 / span 2; grid-column: 2; cursor: pointer; width: 28px; height: 28px;
      text-align: center; border-radius: 6px; color: var(--ink-soft); font-size: 18px; line-height: 28px; }
    #panelClose:hover, #panelClose:focus-visible { background: #f1f3f8; }
    .tabs { display: flex; gap: 4px; padding: 0 12px; border-bottom: 1px solid var(--line); }
    .tabs button { all: unset; cursor: pointer; padding: 8px 6px; font-size: 13px; color: var(--ink-soft);
      border-bottom: 2px solid transparent; }
    .tabs button[aria-selected="true"] { color: var(--accent); border-color: var(--accent); font-weight: 600; }
    .tabs button:focus-visible { outline: 2px solid var(--accent); }
    #panelBody { padding: 12px 16px 16px; overflow: auto; }
    .facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; }
    .facts dt { color: var(--ink-soft); }
    .facts dd { margin: 0; font-variant-numeric: tabular-nums; }
    .note { margin: 0; color: var(--ink-soft); }
    .links { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
    .links li { border-left: 2px solid var(--link); padding-left: 8px; }
    .links button { padding: 6px 0; }
    .links button:hover, .links button:focus-visible { color: var(--accent); }

    .rotate {
      position: fixed; right: 16px; bottom: 16px; display: flex; align-items: center; gap: 10px;
      background: rgba(255, 255, 255, 0.9); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px;
      font-size: 12px; color: var(--ink-soft);
    }
    .rotate output { display: inline-block; min-width: 3.2em; color: var(--ink); font-variant-numeric: tabular-nums; }
    #angle { width: 180px; accent-color: var(--accent); }

    @media (max-width: 640px) {
      #panel { left: 16px; right: 16px; width: auto; top: auto; bottom: 72px; max-height: 45%; }
      #angle { width: 120px; }
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="오픈웹(위) · 다크웹(아래) 3D 연결 판"></canvas>

  <header class="bar">
    <span class="brand">연결 3D</span>
    <span class="tag">시제품</span>
    <div class="find">
      <input id="search" type="search" placeholder="영토 찾기 — 오픈웹 · 다크웹" autocomplete="off" aria-label="영토 찾기">
      <ul id="results"></ul>
    </div>
  </header>

  <ul class="status" aria-live="polite">
    <li id="stDark">다크웹 배치 결과를 받는 중</li>
    <li id="stOpen"></li>
    <li id="stLinks"></li>
  </ul>

  <div id="labels"></div>
  <div id="tip" hidden></div>
  <div id="toast" role="status" hidden></div>

  <aside id="panel" class="collapsed" aria-label="고른 영토">
    <div class="panel-head">
      <h2 id="panelTitle"></h2>
      <p id="panelSub"></p>
      <button id="panelClose" type="button" aria-label="고르기 풀기">×</button>
    </div>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="overview" aria-selected="true">개요</button>
      <button type="button" role="tab" data-tab="events" aria-selected="false">사건</button>
      <button type="button" role="tab" data-tab="links" aria-selected="false">연결</button>
    </div>
    <div id="panelBody"></div>
  </aside>

  <div class="rotate">
    <label for="angle">회전</label>
    <input id="angle" type="range" min="0" max="360" step="1" value="160">
    <output id="angleOut" for="angle">160°</output>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
